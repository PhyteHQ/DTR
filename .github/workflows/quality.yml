name: DTR quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check JavaScript syntax
        shell: bash
        run: |
          for file in ./*.js ./tests/*.mjs ./scripts/*.mjs; do
            node --check "$file"
          done
      - name: Run static quality audit
        run: node tests/static-audit.mjs
      - name: Run telemetry validation and recovery audit
        run: node tests/dtr-telemetry.test.mjs
      - name: Run help guide integration audit
        run: node tests/dtr-help.test.mjs
      - name: Run calculator runtime audit
        run: node tests/calculator-runtime.mjs
      - name: Run production runtime audit
        run: node tests/production-runtime.mjs
      - name: Run forum composer runtime audit
        run: node tests/forum-runtime.mjs
      - name: Run avatar frame audit
        run: node tests/dtr-avatar.test.mjs
      - name: Run shipyard runtime audit
        run: node tests/shipyard-runtime.mjs
      - name: Run price-direction runtime audit
        run: node tests/procurement-runtime.mjs
      - name: Check native trade route modules
        run: |
          for file in dtr-trade-routes.mjs dtr-route-policy.mjs dtr-ship-profiles.mjs dtr-ship-controller.mjs trade-core/*.mjs trade-core/vendor/lp-solver.mjs; do node --check "$file"; done
      - name: Run route policy audit
        run: node tests/dtr-route-policy.test.mjs
      - name: Run complete docking audit against captured API rules
        run: node tests/dtr-docking.test.mjs
      - name: Run trade routes runtime audit
        run: node tests/dtr-trade-routes.test.mjs
      - name: Run route sorting and POB market audit
        run: node tests/dtr-market-runtime.mjs
      - name: Run ship profiles audit
        run: node tests/dtr-ships.test.mjs
      - name: Run ship selector interaction audit
        run: node tests/dtr-ships-dom.test.mjs
      - name: Probe live Darkstat trade data
        continue-on-error: true
        run: node tests/dtr-route-live-smoke.mjs
      - name: Audit current public Discovery recipes without updating the app
        run: node scripts/audit-live-recipes.mjs "$RUNNER_TEMP/dtr-recipe-audit"
      - name: Check the current candidate against calculator and production runtimes
        run: node tests/dtr-recipe-candidate.mjs "$RUNNER_TEMP/dtr-recipe-audit/recipe-catalog.current.js"
      - name: Retain public recipe sources and comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dtr-recipe-audit
          path: ${{ runner.temp }}/dtr-recipe-audit
          retention-days: 7
          if-no-files-found: warn
